# bin/geoview を Windows で geoview.exe として呼べるようにする uv tool 用のパッケージ（install.ps1 が uv tool install する）。
# 本体は共通の bin/geoview を実行時に読む。dependencies は bin/geoview の PEP 723 ブロックと揃える
[project]
name = "geoview-win"
version = "0.1.0"
description = "bin/geoview の Windows 用ランチャー"
# rasterio の Windows wheel は cp312 以降だけ
requires-python = ">=3.12"
dependencies = ["rasterio>=1.4", "numpy>=2"]

[project.scripts]
geoview = "geoview_shim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["geoview_shim.py"]
