# windows/ の検査（Pester。windows/README.md）。windows-latest は Pester 5 があり管理者で動くので、シンボリックリンクを作れる
name: windows
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # ランナーの git は core.autocrlf=true。共通のシェルスクリプトを Git Bash で動かす検査があるので LF で取り出す
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: pwsh -NoProfile -File windows/tests/run.ps1
