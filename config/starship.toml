"$schema" = "https://starship.rs/config-schema.json"

# 2 行・最小構成: [ホスト] ディレクトリ ブランチ 状態 / 入力欄
format = """
$hostname$directory$git_branch$git_status
$character"""
add_newline = true
palette = "onedark"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold yellow"

[directory]
truncation_length = 4
style = "bold blue"

[git_branch]
format = "[$branch]($style) "
style = "purple"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "red"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[palettes.onedark]
black = "#282c34"
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
blue = "#61afef"
purple = "#c678dd"
cyan = "#56b6c2"
white = "#abb2bf"
