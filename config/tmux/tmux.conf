# ===== キー操作 =====

# プレフィックスを C-b から C-g に変更
unbind C-b
set -g prefix C-g
bind C-g send-prefix

# prefix + h/j/k/l でペイン移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# prefix + - で上下分割、prefix + | で左右分割（現在のディレクトリを引き継ぐ）
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# prefix + H/J/K/L でペインのサイズ変更（-r で連続入力可）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 設定の再読み込み: prefix + r（terminal-features は set -as で追記するので、読み直す前に既定へ戻す）
bind r set -su terminal-features \; source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# マウス操作を有効化（ペイン選択・リサイズ・スクロール）
set -g mouse on

# ===== ターミナル連携 =====

# True Color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"

# Esc の反応を速くする（Neovim 用）
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

# OSC52 でコピーをローカルのクリップボードへ（SSH 越しでも有効）
set -g set-clipboard on

# Shift+Enter などの修飾キーをアプリに渡す（Claude Code の改行入力）
set -g extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys,xterm*:extkeys"

# 画像表示（yazi 等）と通知の passthrough。3.4 以降は非表示ペインからも通す
set -g allow-passthrough on
if-shell '[ "$(tmux -V | tr -dc 0-9 | cut -c1-2)" -ge 34 ]' 'set -g allow-passthrough all'

# ===== 見た目（One Dark）=====

set -g status-style "bg=#282c34,fg=#abb2bf"
set -g status-left "#[fg=#282c34,bg=#61afef,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#5c6370]#h "
set -g message-style "bg=#3e4452,fg=#e5c07b"
set -g pane-border-style "fg=#3e4452"
set -g pane-active-border-style "fg=#61afef"

# エージェントの状態（bin/agent-status が window option @agent に設定）
#   ● 作業中  ? 入力待ち  ✓ 完了
set -g @agent_fmt "#{?#{==:#{@agent},waiting},#[fg=#e06c75#,bold]? ,#{?#{==:#{@agent},working},#[fg=#e5c07b]● ,#{?#{==:#{@agent},done},#[fg=#98c379]✓ ,}}}"
set -g window-status-format " #{E:@agent_fmt}#[fg=#5c6370,nobold]#I:#W "
set -g window-status-current-format "#[bg=#3e4452] #{E:@agent_fmt}#[fg=#e5e5e5,bold]#I:#W #[default]"
set -g window-status-separator ""
