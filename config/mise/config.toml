[tools]
# 基本 CLI
ripgrep = "latest"
fd = "latest"
bat = "latest"
# eza: linux・windows は aqua。mac は Brewfile（eza は mac の配布物を出しておらず、lock に URL と checksum を書けない）。
# backend を書くのは、mise の登録が Windows では別の backend（vfox）を選び、lock とずれるため
"aqua:eza-community/eza" = { version = "latest", os = ["linux", "windows"] }
fzf = "latest"
starship = "latest"
gh = "latest"
jq = "latest" # tests/acceptance と tests/static.sh が使う（Ubuntu / WSL には既定で無い）
gitleaks = "latest" # bin/integrate の関門（秘密）が使う
shellcheck = "0.11.0" # tests/static.sh が使う。版を固定する（新しい版で警告が増えると関門が急に落ちる。.github/workflows/check.yml の shellcheck-py と一緒に上げる）

# 言語ツール（Python のランタイムは uv。Node は mise: プロジェクトの mise.toml・.node-version・.nvmrc の版、無ければ最新の LTS）
uv = "latest"
node = "lts"

# AI エージェントの長期記憶（Claude Code / Codex 共通）
# 自作ツールなので明示バージョン（mise は公開 24h 未満のリリースを "latest" で選ばないため）
"github:arkrtm/tinymemory" = "0.2.0"

# tmux: 公式の静的ビルド（sudo・Homebrew 不要、mac / linux 共通。Windows 版は無い）
"aqua:tmux/tmux-builds" = { version = "latest", os = ["linux", "macos"] }

# git / docker の TUI
lazygit = "latest"
lazydocker = "latest"

# エディタ・ファイラー
neovim = "latest"
tree-sitter = "latest" # nvim-treesitter のパーサービルド用

# ---- 以下はテーブル形式（この後ろに通常の key = value を書くとテーブルに入るので注意）----

# yazi: linux は glibc 非依存の musl 版（Debian 12 = glibc 2.36 でも動くように）
[tools."github:sxyazi/yazi"]
version = "latest"

[tools."github:sxyazi/yazi".platforms]
linux-x64 = { asset_pattern = "yazi-x86_64-unknown-linux-musl.zip" }
linux-arm64 = { asset_pattern = "yazi-aarch64-unknown-linux-musl.zip" }

# .node-version・.nvmrc を読む（mise は既定で読まない）
[settings]
idiomatic_version_file_enable_tools = ["node"]
