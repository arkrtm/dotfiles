[tools]
# 基本 CLI
ripgrep = "latest"
fd = "latest"
bat = "latest"
eza = "latest"
fzf = "latest"
starship = "latest"
gh = "latest"

# 言語ツール（ランタイム自体の管理は uv / fnm に任せる）
uv = "latest"
"aqua:Schniz/fnm" = "latest"

# AI エージェントの長期記憶（Claude Code / Codex 共通）
# 自作ツールなので明示バージョン（mise は公開 24h 未満のリリースを "latest" で選ばないため）
"github:arkrtm/tinymemory" = "0.1.1"

# エディタ・ファイラー
neovim = "latest"
tree-sitter = "latest" # nvim-treesitter のパーサービルド用

# ---- 以下はテーブル形式（この後ろに通常の key = value を書くとテーブルに入るので注意）----

# yazi: linux は glibc 非依存の musl 版（Debian 12 = glibc 2.36 でも動くように）
[tools."github:sxyazi/yazi"]
version = "latest"

[tools."github:sxyazi/yazi".platforms]
linux-x64 = { asset_pattern = "yazi-x86_64-unknown-linux-musl.zip" }
linux-arm64 = { asset_pattern = "yazi-aarch64-unknown-linux-musl.zip" }
