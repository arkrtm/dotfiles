[project]
name = "cc-memory"
version = "0.1.0"
description = "Per-directory searchable long-term memory for Claude Code (sqlite FTS5 + optional semantic)."
requires-python = ">=3.12"
dependencies = ["mcp>=1.28,<2"]

[project.optional-dependencies]
# Semantic search layer. pre-v1 pins are EXACT on purpose (breaking changes expected).
vec = ["sqlite-vec==0.1.9", "fastembed==0.7.1"]

[project.scripts]
cc-memory = "cc_memory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "ASYNC", "PT", "SIM", "RET", "C4", "UP", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
